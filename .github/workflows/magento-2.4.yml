name: Magento 2.4 Community Edition Docker container build
on:
  pull_request:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GitHub caps a job's matrix at 256 configurations, so the versions are split
# over two jobs. New releases go in `build`; `build-legacy` is a frozen list.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { PHP_VERSION: php85-fpm, MAGENTO_VERSION: 2.4.9, SAMPLE_DATA: false, MAIN_VERSION: true, LATEST: true }
          - { PHP_VERSION: php85-fpm, MAGENTO_VERSION: 2.4.9, SAMPLE_DATA: true, MAIN_VERSION: true, LATEST: true }
          - { PHP_VERSION: php84-fpm, MAGENTO_VERSION: 2.4.9, SAMPLE_DATA: false }
