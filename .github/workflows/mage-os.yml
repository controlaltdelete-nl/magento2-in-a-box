name: Mage-OS Build
on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HYVA_PRIVATE_KEY: ${{ secrets.HYVA_PRIVATE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 2.0.0, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 2.0.0, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 2.0.0, SAMPLE_DATA: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 2.0.0, SAMPLE_DATA: false }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.3.1, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.3.1, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.3.0, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.3.0, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.2.0, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.2.0, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.1.1, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.1.1, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.1.0, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.1.0, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.0.6, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.0.6, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.0.5, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.0.5, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.0.4, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.0.4, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.0.3, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.0.3, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.0.2, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.0.2, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php82-fpm, MAGEOS_VERSION: 1.0.1, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php82-fpm, MAGEOS_VERSION: 1.0.1, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php82-fpm, MAGEOS_VERSION: 1.0.0, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php82-fpm, MAGEOS_VERSION: 1.0.0, SAMPLE_DATA: false, MAIN_VERSION: true }
    steps:
    - uses: actions/checkout@v5

    # Step 1: Build the docker image
    - name: Compute tag
      id: tags
      run: |
        tag="${{ matrix.cfg.PHP_VERSION }}-mage-os${{ matrix.cfg.MAGEOS_VERSION }}"
        main_tag="mage-os${{ matrix.cfg.MAGEOS_VERSION }}"

        if [[ "${{ matrix.cfg.SAMPLE_DATA }}" == "true" ]]; then
          tag="${tag}-sample-data"
          main_tag="${main_tag}-sample-data"
        fi

        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "main_tag=$main_tag" >> "$GITHUB_OUTPUT"

    - name: Build the Docker image
      run:
        docker build mage-os -f mage-os/Dockerfile
        -t michielgerritsen/mage-os-community-edition:${{ steps.tags.outputs.tag }}
        -t ghcr.io/${{ github.repository }}/mage-os-community-edition:${{ steps.tags.outputs.tag }}
        -t ghcr.io/${{ github.repository }}/mage-os-community-edition:${{ steps.tags.outputs.main_tag }}
        --build-arg MAGEOS_VERSION=${{ matrix.cfg.MAGEOS_VERSION }}
        --build-arg PHP_VERSION=${{ matrix.cfg.PHP_VERSION }}
        --build-arg SAMPLE_DATA=${{ matrix.cfg.SAMPLE_DATA }}

    # Step 2: Test the docker image
    - name: Randomly enable or disable Varnish
      id: varnish
      run: |
        if [ $((RANDOM % 2)) -eq 1 ]; then
          echo "enabled=true" >> $GITHUB_OUTPUT
          echo "Varnish: enabled"
        else
          echo "enabled=false" >> $GITHUB_OUTPUT
          echo "Varnish: disabled"
        fi

    - name: Add magento.test to hosts file
      run: echo "127.0.0.1 magento.test" | sudo tee -a /etc/hosts

    - name: Start the docker image
      run:
        docker run --detach --name mage-os-community-edition
        -p 80:80
        -e ENABLE_VARNISH=${{ steps.varnish.outputs.enabled }}
        -e URL=http://magento.test/
        michielgerritsen/mage-os-community-edition:${{ steps.tags.outputs.tag }}

    - name: Verify webserver is accessible
      run: |
        if [ "${{ steps.varnish.outputs.enabled }}" = "true" ]; then
          HEADER_CHECK="X-Magento-Tags"
        else
          HEADER_CHECK="200 OK"
        fi
        for i in $(seq 1 30); do
          if curl -s -D- -o /dev/null http://magento.test/ | grep -qi "$HEADER_CHECK"; then
            echo "Webserver is responding (checked for: $HEADER_CHECK)"
            exit 0
          fi
          echo "Attempt $i: waiting for webserver..."
          sleep 2
        done
        echo "Webserver did not respond in time (checked for: $HEADER_CHECK)"
        exit 1

    - name: Install Playwright
      run: |
        npm install
        npx playwright install --with-deps chromium

    - name: Run Playwright tests (base)
      if: matrix.cfg.SAMPLE_DATA == false
      run: npx playwright test tests/storefront.spec.ts tests/customer-account.spec.ts

    - name: Run Playwright tests (all)
      if: matrix.cfg.SAMPLE_DATA == true
      run: npx playwright test tests/storefront.spec.ts tests/customer-account.spec.ts tests/cart-and-checkout.spec.ts

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ steps.tags.outputs.tag }}
        path: |
          playwright-report/
          test-results/

    - name: Verify tool versions
      run: |
        docker exec mage-os-community-edition node --version
        docker exec mage-os-community-edition npm --version
        docker exec mage-os-community-edition php --version
        docker exec mage-os-community-edition mysql --version

    - name: Copy the example test module
      run: |
        docker exec mage-os-community-edition mkdir -p /data/extensions/MichielGerritsen-ExampleTest/Test/Integration/
        docker cp Test/composer.json mage-os-community-edition:/data/extensions/MichielGerritsen-ExampleTest/
        docker cp Test/ExampleTest.php mage-os-community-edition:/data/extensions/MichielGerritsen-ExampleTest/Test/Integration/

    - name: Install the example test module
      run: docker exec mage-os-community-edition composer require michielgerritsen/exampletest:@dev

    - name: Enable developer mode
      run: docker exec mage-os-community-edition ./retry "bin/magento deploy:mode:set developer"

    - name: Run setup:di:compile
      run: docker exec mage-os-community-edition ./retry "php bin/magento setup:di:compile"

    - name: Install the example test module
      run: docker exec mage-os-community-edition composer require michielgerritsen/exampletest:@dev

    # Step 3: Upload the images to Docker Hub and ghcr.io.
    - name: Push the image to GitHub Container Registry
      if: github.ref == 'refs/heads/master'
      env:
        MAIN_VERSION: ${{ matrix.cfg.MAIN_VERSION }}
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        docker push ghcr.io/${{ github.repository }}/mage-os-community-edition:${{ steps.tags.outputs.tag }}
        if [[ -n "${MAIN_VERSION}" ]]; then
          docker push ghcr.io/${{ github.repository }}/mage-os-community-edition:${{ steps.tags.outputs.main_tag }}
        fi

    - name: Push the image to Docker hub
      if: github.ref == 'refs/heads/master'
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        docker push michielgerritsen/mage-os-community-edition:${{ steps.tags.outputs.tag }}

    # Step 4: Optional Hyva variant build & test & push.
    # Runs only when HYVA_PRIVATE_KEY is set. The SSH key stays on the
    # runner: we clone the Hyva repositories here, then the Dockerfile
    # bind-mounts the source during the build. The key never enters the
    # container image.
    - name: Determine if the Hyva variant should be built
      id: hyva
      run: |
        if [[ -n "$HYVA_PRIVATE_KEY" ]]; then
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "tag=${{ steps.tags.outputs.tag }}-hyva" >> "$GITHUB_OUTPUT"
          echo "main_tag=${{ steps.tags.outputs.main_tag }}-hyva" >> "$GITHUB_OUTPUT"
        else
          echo "build=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Clone the Hyva source on the runner
      if: steps.hyva.outputs.build == 'true'
      run: |
        set -e
        SSH_DIR="$(mktemp -d)"
        chmod 700 "$SSH_DIR"
        KEY_FILE="${SSH_DIR}/id_hyva"
        KNOWN_HOSTS="${SSH_DIR}/known_hosts"
        printf '%s\n' "$HYVA_PRIVATE_KEY" > "$KEY_FILE"
        chmod 600 "$KEY_FILE"
        ssh-keyscan -t rsa,ecdsa,ed25519 gitlab.hyva.io > "$KNOWN_HOSTS" 2>/dev/null
        export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o UserKnownHostsFile=$KNOWN_HOSTS"

        rm -rf mage-os/hyva-src
        mkdir -p mage-os/hyva-src
        for repo in \
          magento2-theme-module \
          magento2-reset-theme \
          magento2-email-module \
          magento2-default-theme \
          magento2-compat-module-fallback \
          magento2-luma-checkout \
          magento2-theme-fallback; do
          git clone --depth=1 "git@gitlab.hyva.io:hyva-themes/${repo}.git" "mage-os/hyva-src/${repo}"
          rm -rf "mage-os/hyva-src/${repo}/.git"
        done

        shred -u "$KEY_FILE" 2>/dev/null || rm -f "$KEY_FILE"
        rm -rf "$SSH_DIR"

    - name: Stop the base container before starting the Hyva container
      if: steps.hyva.outputs.build == 'true'
      run: docker rm -f mage-os-community-edition

    - name: Build the Hyva Docker image
      if: steps.hyva.outputs.build == 'true'
      env:
        DOCKER_BUILDKIT: "1"
      run: |
        docker build mage-os -f mage-os/Dockerfile-hyva \
          --build-arg BASE_IMAGE=michielgerritsen/mage-os-community-edition:${{ steps.tags.outputs.tag }} \
          -t ghcr.io/${{ github.repository }}/mage-os-community-edition:${{ steps.hyva.outputs.tag }} \
          -t ghcr.io/${{ github.repository }}/mage-os-community-edition:${{ steps.hyva.outputs.main_tag }}

    - name: Remove the Hyva source from the runner
      if: always() && steps.hyva.outputs.build == 'true'
      run: rm -rf mage-os/hyva-src

    - name: Start the Hyva Docker image
      if: steps.hyva.outputs.build == 'true'
      run: |
        docker run --detach --name mage-os-community-edition-hyva \
          -p 80:80 \
          -e ENABLE_VARNISH=${{ steps.varnish.outputs.enabled }} \
          -e URL=http://magento.test/ \
          ghcr.io/${{ github.repository }}/mage-os-community-edition:${{ steps.hyva.outputs.tag }}

    - name: Verify the Hyva webserver is accessible
      if: steps.hyva.outputs.build == 'true'
      run: |
        if [ "${{ steps.varnish.outputs.enabled }}" = "true" ]; then
          HEADER_CHECK="X-Magento-Tags"
        else
          HEADER_CHECK="200 OK"
        fi
        for i in $(seq 1 30); do
          if curl -s -D- -o /dev/null http://magento.test/ | grep -qi "$HEADER_CHECK"; then
            echo "Hyva webserver is responding (checked for: $HEADER_CHECK)"
            exit 0
          fi
          echo "Attempt $i: waiting for Hyva webserver..."
          sleep 2
        done
        echo "Hyva webserver did not respond in time (checked for: $HEADER_CHECK)"
        exit 1

    - name: Run the Hyva Playwright test
      if: steps.hyva.outputs.build == 'true'
      run: npx playwright test tests/storefront-hyva.spec.ts

    - name: Upload the Hyva Playwright report
      if: failure() && steps.hyva.outputs.build == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ steps.hyva.outputs.tag }}
        path: |
          playwright-report/
          test-results/

    - name: Push the Hyva image to GitHub Container Registry
      if: github.ref == 'refs/heads/master' && steps.hyva.outputs.build == 'true'
      env:
        MAIN_VERSION: ${{ matrix.cfg.MAIN_VERSION }}
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        docker push ghcr.io/${{ github.repository }}/mage-os-community-edition:${{ steps.hyva.outputs.tag }}
        if [[ -n "${MAIN_VERSION}" ]]; then
          docker push ghcr.io/${{ github.repository }}/mage-os-community-edition:${{ steps.hyva.outputs.main_tag }}
        fi

    - name: Dump Docker logs files (on failure)
      if: failure()
      run: |
        mkdir -p failure-logs
        if docker inspect mage-os-community-edition >/dev/null 2>&1; then
          docker logs mage-os-community-edition > failure-logs/docker.log 2>&1 || true
          docker cp mage-os-community-edition:/data/var/log failure-logs/var/log || true
        fi
        if docker inspect mage-os-community-edition-hyva >/dev/null 2>&1; then
          docker logs mage-os-community-edition-hyva > failure-logs/docker-hyva.log 2>&1 || true
          docker cp mage-os-community-edition-hyva:/data/var/log failure-logs/var/log-hyva || true
        fi

    - name: Upload failure artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-artifacts-${{ steps.tags.outputs.tag }}
        path: |
          failure-logs
