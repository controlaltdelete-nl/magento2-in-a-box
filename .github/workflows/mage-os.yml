name: Mage-OS Build
on:
  pull_request:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { PHP_VERSION: php85-fpm, MAGEOS_VERSION: 3.4.0, SAMPLE_DATA: true, MAIN_VERSION: true, LATEST: true }
          - { PHP_VERSION: php85-fpm, MAGEOS_VERSION: 3.4.0, SAMPLE_DATA: false, MAIN_VERSION: true, LATEST: true }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 3.4.0, SAMPLE_DATA: true }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 3.4.0, SAMPLE_DATA: false }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 3.4.0, SAMPLE_DATA: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 3.4.0, SAMPLE_DATA: false }
          - { PHP_VERSION: php85-fpm, MAGEOS_VERSION: 3.3.0, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php85-fpm, MAGEOS_VERSION: 3.3.0, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 3.3.0, SAMPLE_DATA: true }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 3.3.0, SAMPLE_DATA: false }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 3.3.0, SAMPLE_DATA: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 3.3.0, SAMPLE_DATA: false }
          - { PHP_VERSION: php85-fpm, MAGEOS_VERSION: 3.2.0, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php85-fpm, MAGEOS_VERSION: 3.2.0, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 3.2.0, SAMPLE_DATA: true }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 3.2.0, SAMPLE_DATA: false }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 3.2.0, SAMPLE_DATA: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 3.2.0, SAMPLE_DATA: false }
          - { PHP_VERSION: php85-fpm, MAGEOS_VERSION: 3.1.0, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php85-fpm, MAGEOS_VERSION: 3.1.0, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 3.1.0, SAMPLE_DATA: true }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 3.1.0, SAMPLE_DATA: false }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 3.1.0, SAMPLE_DATA: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 3.1.0, SAMPLE_DATA: false }
          - { PHP_VERSION: php85-fpm, MAGEOS_VERSION: 3.0.0, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php85-fpm, MAGEOS_VERSION: 3.0.0, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 3.0.0, SAMPLE_DATA: true }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 3.0.0, SAMPLE_DATA: false }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 3.0.0, SAMPLE_DATA: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 3.0.0, SAMPLE_DATA: false }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 2.3.0, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 2.3.0, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 2.3.0, SAMPLE_DATA: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 2.3.0, SAMPLE_DATA: false }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 2.2.2, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 2.2.2, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 2.2.2, SAMPLE_DATA: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 2.2.2, SAMPLE_DATA: false }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 2.2.1, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 2.2.1, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 2.2.1, SAMPLE_DATA: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 2.2.1, SAMPLE_DATA: false }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 2.2.0, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 2.2.0, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 2.2.0, SAMPLE_DATA: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 2.2.0, SAMPLE_DATA: false }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 2.1.0, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 2.1.0, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 2.1.0, SAMPLE_DATA: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 2.1.0, SAMPLE_DATA: false }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 2.0.0, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php84-fpm, MAGEOS_VERSION: 2.0.0, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 2.0.0, SAMPLE_DATA: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 2.0.0, SAMPLE_DATA: false }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.3.1, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.3.1, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.3.0, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.3.0, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.2.0, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.2.0, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.1.1, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.1.1, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.1.0, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.1.0, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.0.6, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.0.6, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.0.5, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.0.5, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.0.4, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.0.4, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.0.3, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.0.3, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.0.2, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php83-fpm, MAGEOS_VERSION: 1.0.2, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php82-fpm, MAGEOS_VERSION: 1.0.1, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php82-fpm, MAGEOS_VERSION: 1.0.1, SAMPLE_DATA: false, MAIN_VERSION: true }
          - { PHP_VERSION: php82-fpm, MAGEOS_VERSION: 1.0.0, SAMPLE_DATA: true, MAIN_VERSION: true }
          - { PHP_VERSION: php82-fpm, MAGEOS_VERSION: 1.0.0, SAMPLE_DATA: false, MAIN_VERSION: true }
    steps:
    - uses: actions/checkout@v5

    # Step 1: Build the docker image
    - name: Compute tag
      id: tags
      run: |
        tag="${{ matrix.cfg.PHP_VERSION }}-mage-os${{ matrix.cfg.MAGEOS_VERSION }}"
        main_tag="mage-os${{ matrix.cfg.MAGEOS_VERSION }}"
        latest_tag=""

        if [[ "${{ matrix.cfg.SAMPLE_DATA }}" == "true" ]]; then
          tag="${tag}-sample-data"
          main_tag="${main_tag}-sample-data"
        fi

        if [[ -n "${{ matrix.cfg.LATEST }}" ]]; then
          latest_tag="latest"
          if [[ "${{ matrix.cfg.SAMPLE_DATA }}" == "true" ]]; then
            latest_tag="latest-sample-data"
          fi
        fi

        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "main_tag=$main_tag" >> "$GITHUB_OUTPUT"
        echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

    - name: Build the Docker image
      run:
        docker build mage-os -f mage-os/Dockerfile
        -t michielgerritsen/mage-os-community-edition:${{ steps.tags.outputs.tag }}
        -t ghcr.io/${{ github.repository }}/mage-os-community-edition:${{ steps.tags.outputs.tag }}
        -t ghcr.io/${{ github.repository }}/mage-os-community-edition:${{ steps.tags.outputs.main_tag }}
        --build-arg MAGEOS_VERSION=${{ matrix.cfg.MAGEOS_VERSION }}
        --build-arg PHP_VERSION=${{ matrix.cfg.PHP_VERSION }}
        --build-arg SAMPLE_DATA=${{ matrix.cfg.SAMPLE_DATA }}

    # Step 2: Test the docker image
    - name: Randomly enable or disable Varnish
      id: varnish
      run: |
        if [ $((RANDOM % 2)) -eq 1 ]; then
          echo "enabled=true" >> $GITHUB_OUTPUT
          echo "Varnish: enabled"
        else
          echo "enabled=false" >> $GITHUB_OUTPUT
          echo "Varnish: disabled"
        fi

    - name: Add magento.test to hosts file
      run: echo "127.0.0.1 magento.test" | sudo tee -a /etc/hosts

    - name: Start the docker image
      run:
        docker run --detach --name mage-os-community-edition
        -p 80:80
        -e ENABLE_VARNISH=${{ steps.varnish.outputs.enabled }}
        -e URL=http://magento.test/
        michielgerritsen/mage-os-community-edition:${{ steps.tags.outputs.tag }}

    - name: Verify webserver is accessible
      run: |
        if [ "${{ steps.varnish.outputs.enabled }}" = "true" ]; then
          HEADER_CHECK="X-Magento-Tags"
        else
          HEADER_CHECK="200 OK"
        fi
        for i in $(seq 1 30); do
          if curl -s -D- -o /dev/null http://magento.test/ | grep -qi "$HEADER_CHECK"; then
            echo "Webserver is responding (checked for: $HEADER_CHECK)"
            exit 0
          fi
          echo "Attempt $i: waiting for webserver..."
          sleep 2
        done
        echo "Webserver did not respond in time (checked for: $HEADER_CHECK)"
        exit 1

    - name: Install Playwright
      timeout-minutes: 10
      run: |
        npm install
        .github/scripts/install-playwright.sh

    - name: Run Playwright tests (base)
      if: matrix.cfg.SAMPLE_DATA == false
      run: npx playwright test tests/storefront.spec.ts tests/customer-account.spec.ts tests/cors.spec.ts

    - name: Run Playwright tests (all)
      if: matrix.cfg.SAMPLE_DATA == true
      run: npx playwright test

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ steps.tags.outputs.tag }}
        path: |
          playwright-report/
          test-results/

    - name: Verify tool versions
      run: |
        docker exec mage-os-community-edition node --version
        docker exec mage-os-community-edition npm --version
        docker exec mage-os-community-edition php --version
        docker exec mage-os-community-edition mysql --version

    - name: Copy the example test module
      run: |
        docker exec mage-os-community-edition mkdir -p /data/extensions/MichielGerritsen-ExampleTest/Test/Integration/
        docker cp Test/composer.json mage-os-community-edition:/data/extensions/MichielGerritsen-ExampleTest/
        docker cp Test/ExampleTest.php mage-os-community-edition:/data/extensions/MichielGerritsen-ExampleTest/Test/Integration/

    - name: Install the example test module
      run: docker exec mage-os-community-edition composer require michielgerritsen/exampletest:@dev

    - name: Enable developer mode
      run: docker exec mage-os-community-edition ./retry "bin/magento deploy:mode:set developer"

    - name: Run setup:di:compile
      run: docker exec mage-os-community-edition ./retry "php bin/magento setup:di:compile"

    - name: Install the example test module
      run: docker exec mage-os-community-edition composer require michielgerritsen/exampletest:@dev

    # Step 3: Upload the images to Docker Hub and ghcr.io.
    - name: Push the image to GitHub Container Registry
      if: github.ref == 'refs/heads/master'
      env:
        MAIN_VERSION: ${{ matrix.cfg.MAIN_VERSION }}
        LATEST_TAG: ${{ steps.tags.outputs.latest_tag }}
        IMAGE: ghcr.io/${{ github.repository }}/mage-os-community-edition
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        .github/scripts/docker-push.sh "${IMAGE}:${{ steps.tags.outputs.tag }}"
        if [[ -n "${MAIN_VERSION}" ]]; then
          .github/scripts/docker-push.sh "${IMAGE}:${{ steps.tags.outputs.main_tag }}"
        fi
        if [[ -n "${LATEST_TAG}" ]]; then
          docker tag "${IMAGE}:${{ steps.tags.outputs.tag }}" "${IMAGE}:${LATEST_TAG}"
          .github/scripts/docker-push.sh "${IMAGE}:${LATEST_TAG}"
        fi

    - name: Push the image to Docker hub
      if: github.ref == 'refs/heads/master'
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        .github/scripts/docker-push.sh michielgerritsen/mage-os-community-edition:${{ steps.tags.outputs.tag }}

    - name: Dump Docker logs files (on failure)
      if: failure()
      run: |
        mkdir failure-logs
        docker logs mage-os-community-edition > failure-logs/docker.log
        docker cp mage-os-community-edition:/data/var/log failure-logs/var/log

    - name: Upload failure artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-artifacts-${{ steps.tags.outputs.tag }}
        path: |
          failure-logs
